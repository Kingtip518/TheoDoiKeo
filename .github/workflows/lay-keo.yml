name: Lay keo moi gio

on:
  schedule:
    - cron: '7 * * * *'   # chạy mỗi giờ, vào phút thứ 7
  workflow_dispatch:       # cho phép bấm chạy tay

permissions:
  contents: write

concurrency:
  group: lay-keo
  cancel-in-progress: false

jobs:
  lay-keo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lay keo
        run: node scripts/lay-keo.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Luu du lieu
        run: |
          git config user.name "may-lay-keo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Khong co gi moi"; exit 0; fi
          git commit -m "Cap nhat keo"
          git pull --rebase
          git push
